openapi: 3.0.3
info:
  title: Galileo API
  description: 自然语言转 SQL 系统 API 文档
  version: 1.0.0
  contact:
    name: xusy

servers:
  - url: /api
    description: API 服务

tags:
  - name: Query
    description: 自然语言查询相关
  - name: Datasources
    description: 数据源连接管理
  - name: Metadata
    description: 元数据浏览与管理
  - name: Domains
    description: 业务域管理
  - name: Relationships
    description: 表关系与图谱
  - name: Statistics
    description: 统计与分析
  - name: AI
    description: AI 相关功能
  - name: Cache
    description: 缓存管理
  - name: Audit
    description: 审计日志
  - name: System
    description: 系统健康与性能

paths:
  # ==================== Query ====================
  /query/preview:
    post:
      tags: [Query]
      summary: 预览 SQL 查询
      description: 将自然语言转换为 SQL 查询并预览
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: 自然语言查询
                datasourceId:
                  type: string
                  description: 数据源 ID
              required: [query]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  sql:
                    type: string
                  tables:
                    type: array
                    items:
                      type: string

  /query/execute:
    post:
      tags: [Query]
      summary: 执行 SQL 查询
      description: 执行 SQL 查询并返回结果
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sql:
                  type: string
                datasourceId:
                  type: string
              required: [sql]
      responses:
        '200':
          description: 成功

  /query/history:
    get:
      tags: [Query]
      summary: 获取查询历史列表
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: 成功

  /query/history/{id}:
    get:
      tags: [Query]
      summary: 获取查询历史详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功

  # ==================== Datasources ====================
  /datasources:
    get:
      tags: [Datasources]
      summary: 获取数据源列表
      parameters:
        - name: status
          in: query
          description: 过滤数据源状态
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
    post:
      tags: [Datasources]
      summary: 创建数据源
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 数据源名称
                type:
                  type: string
                  enum: [mysql, mariadb, postgresql]
                  description: 数据库类型
                host:
                  type: string
                  description: 主机地址
                port:
                  type: integer
                  description: 端口号
                username:
                  type: string
                  description: 用户名
                password:
                  type: string
                  description: 密码
                databases:
                  type: array
                  items:
                    type: string
                  description: 要连接的数据库列表
                description:
                  type: string
                  description: 数据源描述
                autoSync:
                  type: boolean
                  description: 是否自动同步元数据
                  default: false
              required: [name, type, host, port, username, password]
      responses:
        '201':
          description: 创建成功

  /datasources/{id}:
    get:
      tags: [Datasources]
      summary: 获取数据源详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
    put:
      tags: [Datasources]
      summary: 更新数据源
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
    delete:
      tags: [Datasources]
      summary: 删除数据源
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 删除成功

  /datasources/{id}/test:
    post:
      tags: [Datasources]
      summary: 测试数据源连接
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 连接成功

  /datasources/{id}/sync:
    post:
      tags: [Datasources]
      summary: 同步数据源元数据
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 同步成功

  /datasources/{id}/annotate:
    post:
      tags: [Datasources]
      summary: AI 语义标注
      description: 为指定数据源的所有数据库、表、字段执行 AI 语义标注
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 数据源 ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                databases:
                  type: array
                  items:
                    type: string
                  description: 要标注的数据库列表（为空则标注所有数据库）
                force:
                  type: boolean
                  description: 是否强制重新标注已有描述的项
                  default: false
      responses:
        '200':
          description: 标注成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                      summary:
                        type: object
                        properties:
                          databases:
                            type: integer
                          tables:
                            type: integer
                          columns:
                            type: integer
                          ruleProcessed:
                            type: integer
                          aiProcessed:
                            type: integer
                          skipped:
                            type: integer
                          failed:
                            type: integer
                      duration:
                        type: integer

  # ==================== Metadata ====================
  /metadata/databases:
    get:
      tags: [Metadata]
      summary: 获取数据库列表
      responses:
        '200':
          description: 成功

  /metadata/tables:
    get:
      tags: [Metadata]
      summary: 获取表列表
      description: 获取数据库的所有表（支持分页和搜索）
      parameters:
        - name: tableId
          in: query
          description: 表 ID（获取单个表时使用）
          schema:
            type: string
        - name: databaseId
          in: query
          description: 数据库 ID（必需，除非提供 tableId）
          schema:
            type: string
        - name: page
          in: query
          description: 页码
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: 每页数量
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          description: 搜索关键词
          schema:
            type: string
        - name: orderBy
          in: query
          description: 排序字段
          schema:
            type: string
            default: tableName
        - name: orderDirection
          in: query
          description: 排序方向
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer
                      hasNext:
                        type: boolean
                      hasPrev:
                        type: boolean

  /metadata/tables/{id}:
    put:
      tags: [Metadata]
      summary: 更新表的语义描述
      description: 更新指定表的语义描述信息
      parameters:
        - name: id
          in: path
          required: true
          description: 表 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                semanticDescription:
                  type: string
                  description: 语义描述
              required: [semanticDescription]
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      tableName:
                        type: string
                      semanticDescription:
                        type: string
                      updatedAt:
                        type: string
                        format: date-time
        '404':
          description: 表不存在

  /metadata/columns:
    get:
      tags: [Metadata]
      summary: 获取列信息
      parameters:
        - name: tableId
          in: query
          required: true
          description: 表 ID
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer

  /metadata/columns/{id}:
    put:
      tags: [Metadata]
      summary: 更新字段的语义描述
      description: 更新指定字段的语义描述信息
      parameters:
        - name: id
          in: path
          required: true
          description: 字段 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                semanticDescription:
                  type: string
                  description: 语义描述
              required: [semanticDescription]
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      columnName:
                        type: string
                      semanticDescription:
                        type: string
                      semanticSource:
                        type: string
                        enum: [manual, ai, rule]
                      updatedAt:
                        type: string
                        format: date-time
        '404':
          description: 字段不存在

  /metadata/search:
    get:
      tags: [Metadata]
      summary: 搜索元数据
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功

  /metadata/relationships/infer:
    post:
      tags: [Metadata]
      summary: 推断表关系
      description: 基于命名规则和数据特征推断表之间的关系
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                datasourceId:
                  type: string
      responses:
        '200':
          description: 成功

  /metadata/domains:
    get:
      tags: [Metadata]
      summary: 获取元数据业务域列表
      responses:
        '200':
          description: 成功
    post:
      tags: [Metadata]
      summary: 创建元数据业务域
      responses:
        '201':
          description: 创建成功

  /metadata/domains/{id}:
    get:
      tags: [Metadata]
      summary: 获取元数据业务域详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
    put:
      tags: [Metadata]
      summary: 更新元数据业务域
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
    delete:
      tags: [Metadata]
      summary: 删除元数据业务域
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 删除成功

  /metadata/domains/infer:
    post:
      tags: [Metadata]
      summary: 推断单表业务域
      description: 使用 AI 推断表所属的业务域
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tableId:
                  type: string
      responses:
        '200':
          description: 成功

  /metadata/domains/batch-infer:
    post:
      tags: [Metadata]
      summary: 批量推断业务域
      description: 批量推断多个表的业务域
      responses:
        '200':
          description: 成功

  /metadata/domains/apply:
    post:
      tags: [Metadata]
      summary: 应用业务域分配
      description: 将推断的业务域应用到表
      responses:
        '200':
          description: 成功

  /metadata/domains/metrics:
    get:
      tags: [Metadata]
      summary: 获取业务域指标
      description: 获取业务域分配的统计指标
      responses:
        '200':
          description: 成功

  # ==================== Domains ====================
  /domains:
    get:
      tags: [Domains]
      summary: 获取业务域列表
      responses:
        '200':
          description: 成功
    post:
      tags: [Domains]
      summary: 创建业务域
      responses:
        '201':
          description: 创建成功

  /domains/{id}:
    get:
      tags: [Domains]
      summary: 获取业务域详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
    put:
      tags: [Domains]
      summary: 更新业务域
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
    delete:
      tags: [Domains]
      summary: 删除业务域
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 删除成功

  /domains/{id}/keywords:
    get:
      tags: [Domains]
      summary: 获取业务域关键词
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
    put:
      tags: [Domains]
      summary: 更新业务域关键词
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功

  /domains/discover:
    post:
      tags: [Domains]
      summary: 自动发现业务域
      description: 基于表结构和数据自动发现潜在的业务域
      responses:
        '200':
          description: 成功

  # ==================== Relationships ====================
  /relationships/graph:
    get:
      tags: [Relationships]
      summary: 获取关系图谱数据
      description: 获取表之间的关系图谱，用于可视化展示
      parameters:
        - name: datasourceId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 成功

  /relationships/verify:
    post:
      tags: [Relationships]
      summary: 验证表关系
      description: 验证推断的表关系是否正确
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                relationshipId:
                  type: string
                valid:
                  type: boolean
      responses:
        '200':
          description: 成功

  # ==================== Statistics ====================
  /statistics/overview:
    get:
      tags: [Statistics]
      summary: 获取统计概览
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalQueries:
                    type: integer
                  todayQueries:
                    type: integer
                  avgResponseTime:
                    type: number
                  successRate:
                    type: number

  /statistics/hotspots:
    get:
      tags: [Statistics]
      summary: 获取热点统计
      description: 获取查询热点表和字段统计
      responses:
        '200':
          description: 成功

  # ==================== AI ====================
  /ai/cost:
    get:
      tags: [AI]
      summary: 获取 AI 成本统计
      description: 获取 AI 调用的成本统计
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 成功

  /ai/diagnostic:
    get:
      tags: [AI]
      summary: AI 诊断信息
      description: 获取 AI 服务的诊断信息
      responses:
        '200':
          description: 成功

  /ai/prompt-cache:
    get:
      tags: [AI]
      summary: 获取提示词缓存状态
      responses:
        '200':
          description: 成功
    delete:
      tags: [AI]
      summary: 清除提示词缓存
      responses:
        '204':
          description: 清除成功

  # ==================== Cache ====================
  /cache/stats:
    get:
      tags: [Cache]
      summary: 获取缓存统计
      description: 获取查询缓存的命中率等统计信息
      responses:
        '200':
          description: 成功

  /cache/clear:
    post:
      tags: [Cache]
      summary: 清除缓存
      description: 清除指定类型或全部缓存
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [all, query, metadata]
      responses:
        '200':
          description: 清除成功

  # ==================== Audit ====================
  /audit/logs:
    get:
      tags: [Audit]
      summary: 获取审计日志
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: action
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 成功

  /audit/stats:
    get:
      tags: [Audit]
      summary: 获取审计统计
      description: 获取审计日志的统计汇总
      responses:
        '200':
          description: 成功

  # ==================== System ====================
  /health:
    get:
      tags: [System]
      summary: 健康检查
      responses:
        '200':
          description: 系统健康
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, unhealthy]
                  database:
                    type: object
                    properties:
                      status:
                        type: string
                  redis:
                    type: object
                    properties:
                      status:
                        type: string

  /performance:
    get:
      tags: [System]
      summary: 获取性能指标
      description: 获取系统性能监控指标
      responses:
        '200':
          description: 成功
